name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release gate: roc check, roc test, the examples, the bundle sanity
  # check and ./tests.roc under the flake's compiler. tests.roc drives a real
  # unzip, which the flake's dev shell provides.
  test:
    name: Required
    uses: niclas-ahden/roc-workflows/.github/workflows/test.yml@v3
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  roc-versions:
    name: 'Optional: look up Roc versions'
    uses: niclas-ahden/roc-workflows/.github/workflows/resolve-versions.yml@v3

  # The newest downloaded nightly on every operating system, because that is
  # the compiler a user of the package has.
  latest-roc:
    name: 'Optional: latest Roc'
    needs: roc-versions
    uses: niclas-ahden/roc-workflows/.github/workflows/suite.yml@v3
    with:
      roc: ${{ needs.roc-versions.outputs.nightly }}
      label: Tests
      opts: '["speed", "dev", "size", "interpreter"]'
