name: Deploy docs to Pages

on:
  push:
    branches:
      - main
    paths:
      - '**.roc'
      - 'docs/index.html'
      - '.github/workflows/deploy-docs.yml'
  # The docs.tar.gz was attached while the release was a draft, so it is
  # there to serve.
  release:
    types: [published]

  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # The github-pages environment only accepts deployments from the default
  # branch, and a release event runs on the tag, so hand the work to a run on
  # main.
  dispatch:
    name: Deploy from main instead
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-docs.yml --ref main --repo "$GITHUB_REPOSITORY"

  deploy:
    if: github.event_name != 'release'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: niclas-ahden/roc-workflows/.github/workflows/deploy-docs.yml@v3
